    path: ./rule/youtube.yaml
  netflix:
    <<: *rule
    url: https://raw.githubusercontent.com/colorbeta/backmoon/test/rule/netflix.yaml
    path: ./rule/netflix.yaml
  spotify:
    <<: *rule
    url: https://raw.githubusercontent.com/colorbeta/backmoon/test/rule/spotify.yaml
    path: ./rule/spotify.yaml
  google:
    <<: *rule
    url: https://raw.githubusercontent.com/colorbeta/backmoon/test/rule/google.yaml
    path: ./rule/google.yaml
  github:
    <<: *rule
    url: https://raw.githubusercontent.com/colorbeta/backmoon/test/rule/github.yaml
    path: ./rule/github.yaml
  onedrive:
    <<: *rule
    url: https://raw.githubusercontent.com/colorbeta/backmoon/test/rule/onedrive.yaml
    path: ./rule/onedrive.yaml
  microsoft:
    <<: *rule
    url: https://raw.githubusercontent.com/colorbeta/backmoon/test/rule/microsoft.yaml
    path: ./rule/microsoft.yaml
  apple:
    <<: *rule
    url: https://raw.githubusercontent.com/colorbeta/backmoon/test/rule/apple.yaml
    path: ./rule/apple.yaml
  tiktok:
    <<: *rule
    url: https://raw.githubusercontent.com/colorbeta/backmoon/test/rule/tiktok.yaml
    path: ./rule/tiktok.yaml
  paypal:
    <<: *rule
    url: https://raw.githubusercontent.com/colorbeta/backmoon/test/rule/paypal.yaml
    path: ./rule/paypal.yaml
  proxy:
    <<: *rule
    url: https://raw.githubusercontent.com/colorbeta/backmoon/test/rule/proxy.yaml
    path: ./rule/proxy.yaml
  china:
    <<: *rule
    url: https://raw.githubusercontent.com/colorbeta/backmoon/test/rule/china.yaml
