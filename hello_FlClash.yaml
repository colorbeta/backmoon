# FlClash Windows / Android template
# TUN and DNS hijack are enabled to reduce system DNS bypass. Replace subscription URL before use.
mixed-port: 7890
allow-lan: false
bind-address: 127.0.0.1
mode: rule
log-level: warning
ipv6: false
external-controller: 127.0.0.1:9090
secret: ''
unified-delay: true
tun:
  enable: true
  stack: mixed
  dns-hijack:
  - any:53
  - tcp://any:53
  auto-route: true
  auto-detect-interface: true
  strict-route: true
profile:
  store-selected: true
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  nameserver:
  - https://1.1.1.1/dns-query#PROXY
  - https://8.8.8.8/dns-query#PROXY
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - localhost.ptlogin2.qq.com
  - +.msftconnecttest.com
  - +.msftncsi.com
  - time.*.com
  - +.pool.ntp.org
  respect-rules: true
  proxy-server-nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
proxy-providers:
  Airport:
    type: http
    url: https://example.com/replace-with-your-subscription
    interval: 3600
    path: ./providers/airport.yaml
    health-check:
      enable: true
      interval: 600
      url: https://www.gstatic.com/generate_204
proxy-groups:
- name: PROXY
  type: select
  proxies:
  - AUTO
  - HK-AUTO
  - JP-AUTO
  - SG-AUTO
  - US-AUTO
  - MANUAL
  - DIRECT
- name: SPECIAL
  type: select
  proxies:
  - DIRECT
  - PROXY
- name: ADBLOCK
  type: select
  proxies:
  - REJECT
  - DIRECT
- name: AI
  type: select
  proxies:
  - US-AUTO
  - SG-AUTO
  - JP-AUTO
  - AUTO
  - MANUAL
- name: GOOGLE-FCM
  type: select
  proxies:
  - SG-AUTO
  - HK-AUTO
  - JP-AUTO
  - AUTO
  - MANUAL
- name: FOREIGN-MEDIA
  type: select
  proxies:
  - AUTO
  - HK-AUTO
  - JP-AUTO
  - SG-AUTO
  - US-AUTO
  - MANUAL
- name: DOMESTIC-MEDIA
  type: select
  proxies:
  - DIRECT
  - PROXY
- name: TECHNOLOGY
  type: select
  proxies:
  - AUTO
  - HK-AUTO
  - JP-AUTO
  - SG-AUTO
  - US-AUTO
  - MANUAL
  - DIRECT
- name: APPLE
  type: fallback
  proxies:
  - HK-AUTO
  - JP-AUTO
  - SG-AUTO
  - US-AUTO
  - AUTO
  url: https://www.gstatic.com/generate_204
  interval: 600
- name: TIKTOK
  type: select
  proxies:
  - SG-AUTO
  - JP-AUTO
  - US-AUTO
  - AUTO
  - MANUAL
- name: DOMESTIC
  type: select
  proxies:
  - DIRECT
  - PROXY
- name: FINAL
  type: select
  proxies:
  - PROXY
  - AUTO
- name: AUTO
  type: url-test
  use:
  - Airport
  url: https://www.gstatic.com/generate_204
  interval: 600
  tolerance: 80
- name: HK-AUTO
  type: url-test
  use:
  - Airport
  filter: (?i)港|香港|HK|Hong Kong
  url: https://www.gstatic.com/generate_204
  interval: 600
  tolerance: 80
- name: JP-AUTO
  type: url-test
  use:
  - Airport
  filter: (?i)日|日本|JP|Japan|Tokyo
  url: https://www.gstatic.com/generate_204
  interval: 600
  tolerance: 80
- name: SG-AUTO
  type: url-test
  use:
  - Airport
  filter: (?i)新|新加坡|SG|Singapore
  url: https://www.gstatic.com/generate_204
  interval: 600
  tolerance: 80
- name: US-AUTO
  type: url-test
  use:
  - Airport
  filter: (?i)美|美国|US|United States|America
  url: https://www.gstatic.com/generate_204
  interval: 600
  tolerance: 80
- name: MANUAL
  type: select
  use:
  - Airport
rules:
- RULE-SET,Special,SPECIAL
- RULE-SET,Applications,SPECIAL
- IP-CIDR,192.168.50.0/24,SPECIAL,no-resolve
- RULE-SET,Private,SPECIAL
- RULE-SET,LanCIDR,SPECIAL,no-resolve
- RULE-SET,adblock,ADBLOCK
- RULE-SET,ai,AI
- RULE-SET,google_fcm,GOOGLE-FCM
- RULE-SET,ForeignMedia,FOREIGN-MEDIA
- RULE-SET,DomesticMedia,DOMESTIC-MEDIA
- RULE-SET,Technology,TECHNOLOGY
- RULE-SET,apple,APPLE
- RULE-SET,tiktok,TIKTOK
- RULE-SET,Domestic,DOMESTIC
- RULE-SET,DomesticIP,DOMESTIC,no-resolve
- GEOIP,CN,DOMESTIC,no-resolve
- MATCH,FINAL
rule-providers:
  Special:
    type: http
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/colorbeta/backmoon/test/mrs/Special.mrs
    path: ./mrs/Special.mrs
    interval: 86400
  Applications:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/colorbeta/backmoon/test/rule/Applications.yaml
    path: ./rule/Applications.yaml
    interval: 86400
  Private:
    type: http
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/colorbeta/backmoon/test/mrs/Private.mrs
    path: ./mrs/Private.mrs
    interval: 86400
  LanCIDR:
    type: http
    behavior: ipcidr
    format: mrs
    url: https://raw.githubusercontent.com/colorbeta/backmoon/test/mrs/LanCIDR.mrs
    path: ./mrs/LanCIDR.mrs
    interval: 86400
  adblock:
    type: http
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/colorbeta/backmoon/test/mrs/adblock.mrs
    path: ./mrs/adblock.mrs
    interval: 28800
  ai:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/colorbeta/backmoon/test/rule/ai.yaml
    path: ./rule/ai.yaml
    interval: 86400
  google_fcm:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/colorbeta/backmoon/test/rule/google_fcm.yaml
    path: ./rule/google_fcm.yaml
    interval: 86400
  ForeignMedia:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/colorbeta/backmoon/test/rule/ForeignMedia.yaml
    path: ./rule/ForeignMedia.yaml
    interval: 86400
  DomesticMedia:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/colorbeta/backmoon/test/rule/DomesticMedia.yaml
    path: ./rule/DomesticMedia.yaml
    interval: 86400
  Technology:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/colorbeta/backmoon/test/rule/Technology.yaml
    path: ./rule/Technology.yaml
    interval: 86400
  apple:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/colorbeta/backmoon/test/rule/apple.yaml
    path: ./rule/apple.yaml
    interval: 86400
  tiktok:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/colorbeta/backmoon/test/rule/tiktok.yaml
    path: ./rule/tiktok.yaml
    interval: 86400
  Domestic:
    type: http
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/colorbeta/backmoon/test/mrs/Domestic.mrs
    path: ./mrs/Domestic.mrs
    interval: 86400
  DomesticIP:
    type: http
