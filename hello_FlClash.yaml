# FlClash Windows / Android template
# TUN and DNS hijack are enabled to reduce system DNS bypass. Replace subscription URL before use.
mixed-port: 7890
allow-lan: false
bind-address: 127.0.0.1
mode: rule
log-level: warning
ipv6: false
external-controller: 127.0.0.1:9090
secret: ''
unified-delay: true
tcp-concurrent: true
keep-alive-idle: 600
keep-alive-interval: 15
tun:
  enable: true
  stack: mixed
  dns-hijack:
  - any:53
  - tcp://any:53
  auto-route: true
  auto-detect-interface: true
  strict-route: true
profile:
  store-selected: true
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  default-nameserver:
  - https://223.5.5.5/dns-query
  nameserver:
  - https://1.1.1.1/dns-query#LocalFly
  - https://8.8.8.8/dns-query#LocalFly
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - localhost.ptlogin2.qq.com
  - +.msftconnecttest.com
  - +.msftncsi.com
  - time.*.com
  - +.pool.ntp.org
  respect-rules: true
  proxy-server-nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  direct-nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  nameserver-policy:
    "rule-set:CNDirect":
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    "rule-set:Special,Private,CNBank,DomesticMedia,SteamCN,Domestic":
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    "rule-set:ai,Google":
    - https://1.1.1.1/dns-query#ForeignFly
    - https://8.8.8.8/dns-query#ForeignFly
    "rule-set:ForeignMedia,GitHub,Telegram,Steam,Technology,apple,tiktok":
    - https://1.1.1.1/dns-query#LocalFly
    - https://8.8.8.8/dns-query#LocalFly
proxy-providers:
  Airport:
    type: http
    url: https://example.com/replace-with-your-subscription
    interval: 3600
    path: ./providers/airport.yaml
    health-check:
      enable: true
      interval: 600
      url: https://www.gstatic.com/generate_204
proxy-groups:
- name: LocalFly
  type: url-test
  empty-fallback: REJECT
  proxies:
  - REJECT
  use:
  - Airport
  filter: '(?i)台湾|台灣|臺灣|台北|臺北|香港|日本|东京|東京|大阪|新加坡|狮城|獅城|🇹🇼|🇭🇰|🇯🇵|🇸🇬|\b(?:TW|TWN|Taiwan|Taipei|HK|HKG|Hong\s*Kong|JP|JPN|Japan|Tokyo|Osaka|SG|SGP|Singapore)\b'
  url: https://www.gstatic.com/generate_204
  interval: 600
  tolerance: 80
- name: ForeignFly
  type: url-test
  empty-fallback: REJECT
  proxies:
  - REJECT
  use:
  - Airport
  filter: '(?i)新加坡|狮城|獅城|日本|东京|東京|大阪|美国|美國|🇸🇬|🇯🇵|🇺🇸|\b(?:SG|SGP|Singapore|JP|JPN|Japan|Tokyo|Osaka|US|USA|United States|America)\b'
  url: https://www.gstatic.com/generate_204
  interval: 600
  tolerance: 80
rules:
- RULE-SET,CNDirect,DIRECT
- RULE-SET,Special,DIRECT
- RULE-SET,Applications,DIRECT
- IP-CIDR,192.168.50.0/24,DIRECT,no-resolve
- RULE-SET,Private,DIRECT
- RULE-SET,LanCIDR,DIRECT,no-resolve
- RULE-SET,CNBank,DIRECT
- RULE-SET,adblock,REJECT
- RULE-SET,ai,ForeignFly
- RULE-SET,ForeignMedia,LocalFly
- RULE-SET,Google,ForeignFly
- RULE-SET,GitHub,LocalFly
- RULE-SET,Telegram,LocalFly
- RULE-SET,SteamCN,DIRECT
- RULE-SET,Steam,LocalFly
- RULE-SET,DomesticMedia,DIRECT
- RULE-SET,Technology,LocalFly
- RULE-SET,apple,LocalFly
- RULE-SET,tiktok,LocalFly
- RULE-SET,Domestic,DIRECT
- RULE-SET,DomesticExtra,DIRECT
- RULE-SET,DomesticIP,DIRECT,no-resolve
- GEOIP,CN,DIRECT,no-resolve
- MATCH,LocalFly
rule-providers:
