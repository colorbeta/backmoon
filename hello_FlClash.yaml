# FlClash Windows / Android template
# TUN and DNS hijack are enabled to reduce system DNS bypass. Replace subscription URL before use.
mixed-port: 7890
allow-lan: false
bind-address: 127.0.0.1
mode: rule
log-level: warning
ipv6: false
external-controller: 127.0.0.1:9090
secret: ''
unified-delay: true
tun:
  enable: true
  stack: mixed
  dns-hijack:
  - any:53
  - tcp://any:53
  auto-route: true
  auto-detect-interface: true
  strict-route: true
profile:
  store-selected: true
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  nameserver:
  - https://1.1.1.1/dns-query#PROXY
  - https://8.8.8.8/dns-query#PROXY
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - localhost.ptlogin2.qq.com
  - +.msftconnecttest.com
  - +.msftncsi.com
  - time.*.com
  - +.pool.ntp.org
  respect-rules: true
  proxy-server-nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
proxy-providers:
  Airport:
    type: http
    url: https://example.com/replace-with-your-subscription
    interval: 3600
    path: ./providers/airport.yaml
    health-check:
      enable: true
      interval: 600
      url: https://www.gstatic.com/generate_204
proxy-groups:
- name: PROXY
  type: select
  proxies:
  - AUTO
  - HK-AUTO
  - JP-AUTO
  - SG-AUTO
  - US-AUTO
  - MANUAL
  - DIRECT
- name: AI
  type: select
  proxies:
  - US-AUTO
  - SG-AUTO
  - JP-AUTO
  - AUTO
  - MANUAL
- name: TELEGRAM
  type: select
  proxies:
  - SG-AUTO
  - HK-AUTO
  - AUTO
  - MANUAL
- name: STREAMING
  type: select
  proxies:
  - AUTO
  - HK-AUTO
  - JP-AUTO
  - SG-AUTO
  - US-AUTO
  - MANUAL
- name: GOOGLE
  type: select
  proxies:
  - AUTO
  - HK-AUTO
  - JP-AUTO
  - SG-AUTO
  - US-AUTO
  - MANUAL
- name: GOOGLE-FCM
  type: select
  proxies:
  - SG-AUTO
  - HK-AUTO
  - JP-AUTO
  - AUTO
  - MANUAL
- name: GITHUB
  type: select
  proxies:
  - AUTO
  - HK-AUTO
  - JP-AUTO
  - SG-AUTO
  - US-AUTO
  - MANUAL
- name: MICROSOFT
  type: select
  proxies:
  - DIRECT
  - PROXY
  - AUTO
- name: APPLE
  type: fallback
  proxies:
  - HK-AUTO
  - JP-AUTO
  - SG-AUTO
  - US-AUTO
  - AUTO
  url: https://www.gstatic.com/generate_204
  interval: 600
- name: AUTO
  type: url-test
  use:
  - Airport
  url: https://www.gstatic.com/generate_204
  interval: 600
  tolerance: 80
- name: HK-AUTO
  type: url-test
  use:
  - Airport
  filter: (?i)港|香港|HK|Hong Kong
  url: https://www.gstatic.com/generate_204
  interval: 600
  tolerance: 80
- name: JP-AUTO
  type: url-test
  use:
  - Airport
  filter: (?i)日|日本|JP|Japan|Tokyo
  url: https://www.gstatic.com/generate_204
  interval: 600
  tolerance: 80
- name: SG-AUTO
  type: url-test
  use:
  - Airport
  filter: (?i)新|新加坡|SG|Singapore
  url: https://www.gstatic.com/generate_204
  interval: 600
  tolerance: 80
- name: US-AUTO
  type: url-test
  use:
  - Airport
  filter: (?i)美|美国|US|United States|America
  url: https://www.gstatic.com/generate_204
  interval: 600
  tolerance: 80
- name: MANUAL
  type: select
  use:
  - Airport
rules:
- RULE-SET,Local,DIRECT
- IP-CIDR,192.168.50.0/24,DIRECT,no-resolve
- RULE-SET,private,DIRECT
- RULE-SET,adblock,REJECT
- RULE-SET,ai,AI
- RULE-SET,telegram,TELEGRAM
- RULE-SET,youtube,STREAMING
- RULE-SET,netflix,STREAMING
- RULE-SET,spotify,STREAMING
- RULE-SET,google_fcm,GOOGLE-FCM
- RULE-SET,google,GOOGLE
- RULE-SET,github,GITHUB
- RULE-SET,onedrive,MICROSOFT
- RULE-SET,microsoft,MICROSOFT
- RULE-SET,apple,APPLE
- RULE-SET,tiktok,STREAMING
- RULE-SET,paypal,PROXY
- RULE-SET,proxy,PROXY
- RULE-SET,china,DIRECT
- RULE-SET,china_ip,DIRECT
- GEOIP,CN,DIRECT
- MATCH,PROXY
