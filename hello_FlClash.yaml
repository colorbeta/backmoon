# FlClash Windows / Android template
# TUN and DNS hijack are enabled to reduce system DNS bypass. Replace subscription URL before use.
mixed-port: 7890
allow-lan: false
bind-address: 127.0.0.1
mode: rule
log-level: warning
ipv6: false
external-controller: 127.0.0.1:9090
secret: ''
unified-delay: true
tcp-concurrent: true
keep-alive-idle: 600
keep-alive-interval: 15
tun:
  enable: true
  stack: mixed
  dns-hijack:
  - any:53
  - tcp://any:53
  auto-route: true
  auto-detect-interface: true
  strict-route: true
profile:
  store-selected: true
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  default-nameserver:
  - https://223.5.5.5/dns-query
  nameserver:
  - https://1.1.1.1/dns-query#PROXY
  - https://8.8.8.8/dns-query#PROXY
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - localhost.ptlogin2.qq.com
  - +.msftconnecttest.com
  - +.msftncsi.com
  - time.*.com
  - +.pool.ntp.org
  respect-rules: true
  proxy-server-nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  direct-nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  nameserver-policy:
    "rule-set:CNDirect":
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    "rule-set:Special,Private,CNBank,DomesticMedia,SteamCN,Domestic":
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    "rule-set:ai,ForeignMedia,Google,GitHub,Telegram,Steam,Technology,apple,tiktok":
    - https://1.1.1.1/dns-query#PROXY
    - https://8.8.8.8/dns-query#PROXY
proxy-providers:
  Airport:
    type: http
    url: https://example.com/replace-with-your-subscription
    interval: 3600
    path: ./providers/airport.yaml
    health-check:
      enable: true
      interval: 600
      url: https://www.gstatic.com/generate_204
proxy-groups:
- name: PROXY
  type: select
  proxies:
  - AUTO
  - TW-FALLBACK
  - HK-FALLBACK
  - JP-FALLBACK
  - SG-FALLBACK
  - US-FALLBACK
  - HK-AUTO
  - JP-AUTO
  - SG-AUTO
  - US-AUTO
  - MANUAL
  - DIRECT
- name: ADBLOCK
  type: select
  proxies:
  - REJECT
  - DIRECT
- name: AI
  type: select
  proxies: [SG-JP-US, SG-FALLBACK, JP-FALLBACK, US-FALLBACK]
- name: GOOGLE
  type: select
  proxies: [SG-JP-US, SG-FALLBACK, JP-FALLBACK, US-FALLBACK]
- name: SG-JP-US
  type: fallback
  proxies: [SG-FALLBACK, JP-FALLBACK, US-FALLBACK]
  url: https://www.gstatic.com/generate_204
  interval: 600
- name: GITHUB
  type: select
  proxies: [TW-HK-JP-SG, TW-FALLBACK, HK-FALLBACK, JP-FALLBACK, SG-FALLBACK]
- name: TW-HK-JP-SG
  type: fallback
  proxies: [TW-FALLBACK, HK-FALLBACK, JP-FALLBACK, SG-FALLBACK]
  url: https://www.gstatic.com/generate_204
  interval: 600
- name: TELEGRAM
  type: select
  proxies: [TW-HK-JP-SG, TW-FALLBACK, HK-FALLBACK, JP-FALLBACK, SG-FALLBACK]
- name: STEAM
  type: select
  proxies: [TW-HK-JP-SG, TW-FALLBACK, HK-FALLBACK, JP-FALLBACK, SG-FALLBACK]
- name: FOREIGN-MEDIA
  type: select
  proxies:
  - AUTO
  - HK-FALLBACK
  - JP-FALLBACK
  - SG-FALLBACK
  - US-FALLBACK
  - MANUAL
- name: DOMESTIC-MEDIA
  type: select
  proxies:
  - DIRECT
  - PROXY
- name: TECHNOLOGY
  type: select
  proxies:
  - AUTO
  - HK-FALLBACK
  - JP-FALLBACK
  - SG-FALLBACK
  - US-FALLBACK
  - MANUAL
  - DIRECT
- name: APPLE
  type: fallback
  proxies:
  - HK-FALLBACK
  - JP-FALLBACK
  - SG-FALLBACK
  - US-FALLBACK
  - AUTO
  url: https://www.gstatic.com/generate_204
  interval: 600
- name: TIKTOK
  type: select
  proxies: [TW-HK-JP-SG, TW-FALLBACK, HK-FALLBACK, JP-FALLBACK, SG-FALLBACK]
- name: DOMESTIC
  type: select
  proxies:
  - DIRECT
  - PROXY
- name: FINAL
  type: select
  proxies:
  - PROXY
  - AUTO
- name: TW-FALLBACK
  type: fallback
  empty-fallback: REJECT
  use: [Airport]
  filter: '(?i)台湾|台灣|台北|臺灣|臺北|🇹🇼|\b(?:TW|TWN|Taiwan|Taipei)\b'
  url: https://www.gstatic.com/generate_204
  interval: 600
  lazy: true
- name: HK-FALLBACK
  type: fallback
  empty-fallback: REJECT
  use: [Airport]
  filter: (?i)港|香港|HK|Hong Kong
  url: https://www.gstatic.com/generate_204
  interval: 600
  lazy: true
- name: JP-FALLBACK
  type: fallback
  empty-fallback: REJECT
  use: [Airport]
  filter: '(?i)日本|东京|東京|大阪|🇯🇵|\b(?:JP|JPN|Japan|Tokyo|Osaka)\b'
  url: https://www.gstatic.com/generate_204
  interval: 600
  lazy: true
- name: SG-FALLBACK
  type: fallback
  empty-fallback: REJECT
  use: [Airport]
  filter: '(?i)新加坡|狮城|獅城|🇸🇬|\b(?:SG|SGP|Singapore)\b'
  url: https://www.gstatic.com/generate_204
  interval: 600
  lazy: true
- name: US-FALLBACK
  type: fallback
  empty-fallback: REJECT
  use: [Airport]
  filter: '(?i)美国|美國|🇺🇸|\b(?:US|USA|United States|America)\b'
  url: https://www.gstatic.com/generate_204
  interval: 600
  lazy: true
- name: AUTO
  type: url-test
  use:
  - Airport
  url: https://www.gstatic.com/generate_204
  interval: 600
  tolerance: 80
- name: HK-AUTO
  type: url-test
  use:
  - Airport
  filter: (?i)港|香港|HK|Hong Kong
  url: https://www.gstatic.com/generate_204
  interval: 600
  tolerance: 80
- name: JP-AUTO
  type: url-test
  use:
  - Airport
  filter: (?i)日|日本|JP|Japan|Tokyo
  url: https://www.gstatic.com/generate_204
  interval: 600
  tolerance: 80
- name: SG-AUTO
  type: url-test
  use:
  - Airport
  filter: (?i)新|新加坡|SG|Singapore
  url: https://www.gstatic.com/generate_204
  interval: 600
  tolerance: 80
- name: US-AUTO
  type: url-test
  use:
  - Airport
  filter: (?i)美|美国|US|United States|America
  url: https://www.gstatic.com/generate_204
  interval: 600
  tolerance: 80
- name: MANUAL
  type: select
  use:
  - Airport
rules:
- RULE-SET,CNDirect,DIRECT
- RULE-SET,Special,DIRECT
- RULE-SET,Applications,DIRECT
- IP-CIDR,192.168.50.0/24,DIRECT,no-resolve
- RULE-SET,Private,DIRECT
- RULE-SET,LanCIDR,DIRECT,no-resolve
- RULE-SET,CNBank,DIRECT
- RULE-SET,adblock,ADBLOCK
- RULE-SET,ai,AI
- RULE-SET,ForeignMedia,FOREIGN-MEDIA
- RULE-SET,Google,GOOGLE
- RULE-SET,GitHub,GITHUB
- RULE-SET,Telegram,TELEGRAM
- RULE-SET,SteamCN,DIRECT
- RULE-SET,Steam,STEAM
- RULE-SET,DomesticMedia,DOMESTIC-MEDIA
- RULE-SET,Technology,TECHNOLOGY
- RULE-SET,apple,APPLE
- RULE-SET,tiktok,TIKTOK
- RULE-SET,Domestic,DOMESTIC
- RULE-SET,DomesticExtra,DOMESTIC
- RULE-SET,DomesticIP,DOMESTIC,no-resolve
- GEOIP,CN,DOMESTIC,no-resolve
- MATCH,FINAL
