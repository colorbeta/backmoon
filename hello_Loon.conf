# Loon 3.5.3 build 1008+ native profile
# Configure a client-native node subscription before enabling the VPN.
# Keep Airport/edgetunnel resource names when updating subscriptions.
# Native iOS import and handshake testing is required.
# In the app's DNS settings, disable fallback to ordinary DNS.
[General]
ip-mode = v4-only
ipv6-vif = off
doh-server = https://223.5.5.5/dns-query
hijack-dns = *:53
allow-wifi-access = false
udp-fallback-mode = REJECT
disable-stun = false
proxy-test-url = https://www.gstatic.com/generate_204
internet-test-url = http://wifi.vivo.com.cn/generate_204
test-timeout = 5
sni-sniffing = true
[Proxy]
[Plugin]
# Unreviewed remote dependencies and aggressive HTTPDNS blocking remain disabled.
https://raw.githubusercontent.com/colorbeta/backmoon/test/Loon/module/BlockAdvertisers.lpx,enabled=true
https://raw.githubusercontent.com/colorbeta/backmoon/test/Loon/module/Loopback.loon.lpx,enabled=true
https://raw.githubusercontent.com/colorbeta/backmoon/test/Loon/module/Block_HTTPDNS.lpx,enabled=false
https://raw.githubusercontent.com/colorbeta/backmoon/test/Loon/module/Amap_remove_ads.lpx,enabled=false
https://raw.githubusercontent.com/colorbeta/backmoon/test/Loon/module/AppleWeatherEnhancer.lpx,enabled=false
https://raw.githubusercontent.com/colorbeta/backmoon/test/Loon/module/JD_Price.lpx,enabled=true
https://raw.githubusercontent.com/colorbeta/backmoon/test/Loon/module/JD_remove_ads.lpx,enabled=false
https://raw.githubusercontent.com/colorbeta/backmoon/test/Loon/module/Bilibili_remove_ads.lpx,enabled=false
https://raw.githubusercontent.com/colorbeta/backmoon/test/Loon/module/Weibo_intl_remove_ads.lpx,enabled=true
https://raw.githubusercontent.com/colorbeta/backmoon/test/Loon/module/Weibo_remove_ads.lpx,enabled=false
https://raw.githubusercontent.com/colorbeta/backmoon/test/Loon/module/smzdm_remove_ads.lpx,enabled=false
[Remote Proxy]
Airport = https://example.com/replace-with-airport-loon-nodes,enabled=false
edgetunnel = https://example.com/replace-with-edgetunnel-loon-nodes,enabled=false
[Remote Filter]
Nodes_TW = NameRegex,Airport,edgetunnel,FilterKey="(?i)台湾|台灣|臺灣|台北|臺北|🇹🇼|(^|[^a-z])(TW|TWN|Taiwan|Taipei)([^a-z]|$)"
Nodes_HK = NameRegex,Airport,edgetunnel,FilterKey="(?i)香港|港[ _-]*[0-9]|🇭🇰|(^|[^a-z])(HK|HKG|Hong[ _-]*Kong)([^a-z]|$)"
Nodes_JP = NameRegex,Airport,edgetunnel,FilterKey="(?i)日本|东京|東京|大阪|🇯🇵|(^|[^a-z])(JP|JPN|Japan|Tokyo|Osaka)([^a-z]|$)"
Nodes_SG = NameRegex,Airport,edgetunnel,FilterKey="(?i)新加坡|狮城|獅城|🇸🇬|(^|[^a-z])(SG|SGP|Singapore)([^a-z]|$)"
Nodes_US = NameRegex,Airport,edgetunnel,FilterKey="(?i)美国|美國|🇺🇸|(^|[^a-z])(US|USA|United[ _-]*States|America)([^a-z]|$)"
[Proxy Group]
forbid = select,REJECT
LocalFly = select,LocalFly-AUTO,Auto_TW,Auto_HK,Auto_JP,Auto_SG,img-url=https://raw.githubusercontent.com/colorbeta/backmoon/test/icon/LocalFly.png
ForeignFly = select,ForeignFly-AUTO,Auto_SG,Auto_JP,Auto_US,img-url=https://raw.githubusercontent.com/colorbeta/backmoon/test/icon/ForeignFly.png
Auto_TW = url-test,Nodes_TW,url=https://www.gstatic.com/generate_204,interval=600,tolerance=80,img-url=https://raw.githubusercontent.com/colorbeta/backmoon/test/icon/Taiwan.png
Auto_HK = url-test,Nodes_HK,url=https://www.gstatic.com/generate_204,interval=600,tolerance=80,img-url=https://raw.githubusercontent.com/colorbeta/backmoon/test/icon/HongKong.png
Auto_JP = url-test,Nodes_JP,url=https://www.gstatic.com/generate_204,interval=600,tolerance=80,img-url=https://raw.githubusercontent.com/colorbeta/backmoon/test/icon/Japan.png
Auto_SG = url-test,Nodes_SG,url=https://www.gstatic.com/generate_204,interval=600,tolerance=80,img-url=https://raw.githubusercontent.com/colorbeta/backmoon/test/icon/Singapore.png
Auto_US = url-test,Nodes_US,url=https://www.gstatic.com/generate_204,interval=600,tolerance=80,img-url=https://raw.githubusercontent.com/colorbeta/backmoon/test/icon/UnitedStates.png
LocalFly-AUTO = url-test,Nodes_TW,Nodes_HK,Nodes_JP,Nodes_SG,url=https://www.gstatic.com/generate_204,interval=600,tolerance=80,img-url=https://raw.githubusercontent.com/colorbeta/backmoon/test/icon/Auto.png
# Regional url-test groups select nodes; fallback controls SG -> JP -> US priority.
ForeignFly-AUTO = fallback,Auto_SG,Auto_JP,Auto_US,url=https://www.gstatic.com/generate_204,interval=600,max-timeout=5000,img-url=https://raw.githubusercontent.com/colorbeta/backmoon/test/icon/Auto.png
