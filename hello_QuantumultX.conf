# Quantumult X 1.9.0 build 952+ native profile
# Configure a client-native node subscription before enabling the VPN.
# Keep Airport/edgetunnel resource names when updating subscriptions.
# Native iOS import and handshake testing is required.
[general]
resource_parser_url = https://raw.githubusercontent.com/colorbeta/backmoon/test/QuanX/script/resource-parser.js
# Requires QX 1.9.0 build 952+ for device loopback.
reflected_routes = 10.7.0.1/32
profile_img_url = https://raw.githubusercontent.com/colorbeta/backmoon/test/icon/ForeignFly.png
server_check_url = http://www.gstatic.com/generate_204
server_check_timeout = 5000
fallback_udp_policy = reject
# Domestic carrier/login endpoints that need real DNS answers.
dns_exclusion_list = *.10099.com.cn, *.cmpassport.com, *.jegotrip.com.cn, *.icitymobile.mobi, id6.me, *.pingan.com.cn
# Optional WebRTC hardening; may affect voice/video:
# udp_drop_list = STUN
[dns]
no-system
no-ipv6
doh-server = https://223.5.5.5/dns-query
[policy]
static = forbid, reject
static = LocalFly, LocalFly-AUTO, Auto_TW, Auto_HK, Auto_JP, Auto_SG, img-url=https://raw.githubusercontent.com/colorbeta/backmoon/test/icon/LocalFly.png
# Default to Singapore. Choose Japan or US in this selector as needed.
static = ForeignFly, Auto_SG, Auto_JP, Auto_US, img-url=https://raw.githubusercontent.com/colorbeta/backmoon/test/icon/ForeignFly.png
url-latency-benchmark = LocalFly-AUTO, server-tag-regex=(?i)台湾|台灣|臺灣|台北|臺北|香港|日本|东京|東京|大阪|新加坡|狮城|獅城|🇹🇼|🇭🇰|🇯🇵|🇸🇬|(^|[^a-z])(TW|TWN|Taiwan|Taipei|HK|HKG|Hong[ _-]*Kong|JP|JPN|Japan|Tokyo|Osaka|SG|SGP|Singapore)([^a-z]|$), check-interval=600, alive-checking=true, tolerance=80, img-url=https://raw.githubusercontent.com/colorbeta/backmoon/test/icon/Auto.png
url-latency-benchmark = Auto_TW, server-tag-regex=(?i)台湾|台灣|臺灣|台北|臺北|🇹🇼|(^|[^a-z])(TW|TWN|Taiwan|Taipei)([^a-z]|$), check-interval=600, alive-checking=true, tolerance=80, img-url=https://raw.githubusercontent.com/colorbeta/backmoon/test/icon/Taiwan.png
url-latency-benchmark = Auto_HK, server-tag-regex=(?i)香港|港[ _-]*[0-9]|🇭🇰|(^|[^a-z])(HK|HKG|Hong[ _-]*Kong)([^a-z]|$), check-interval=600, alive-checking=true, tolerance=80, img-url=https://raw.githubusercontent.com/colorbeta/backmoon/test/icon/HongKong.png
url-latency-benchmark = Auto_JP, server-tag-regex=(?i)日本|东京|東京|大阪|🇯🇵|(^|[^a-z])(JP|JPN|Japan|Tokyo|Osaka)([^a-z]|$), check-interval=600, alive-checking=true, tolerance=80, img-url=https://raw.githubusercontent.com/colorbeta/backmoon/test/icon/Japan.png
url-latency-benchmark = Auto_SG, server-tag-regex=(?i)新加坡|狮城|獅城|🇸🇬|(^|[^a-z])(SG|SGP|Singapore)([^a-z]|$), check-interval=600, alive-checking=true, tolerance=80, img-url=https://raw.githubusercontent.com/colorbeta/backmoon/test/icon/Singapore.png
url-latency-benchmark = Auto_US, server-tag-regex=(?i)美国|美國|🇺🇸|(^|[^a-z])(US|USA|United[ _-]*States|America)([^a-z]|$), check-interval=600, alive-checking=true, tolerance=80, img-url=https://raw.githubusercontent.com/colorbeta/backmoon/test/icon/UnitedStates.png
[server_remote]
https://example.com/replace-with-airport-quantumultx-nodes#cert=1, tag=Airport, opt-parser=true, update-interval=3600, enabled=false
https://example.com/replace-with-edgetunnel-quantumultx-nodes#cert=1, tag=edgetunnel, opt-parser=true, update-interval=3600, enabled=false
[server_local]
[filter_local]
host, play.googleapis.com, forbid
ip-cidr, 192.168.50.0/24, direct
host-suffix, minimax.io, direct
final, LocalFly
[filter_remote]
https://raw.githubusercontent.com/colorbeta/backmoon/test/QuanX/rule/Private.list, tag=Private, force-policy=direct, update-interval=86400, enabled=true
https://raw.githubusercontent.com/colorbeta/backmoon/test/QuanX/rule/LanCIDR.list, tag=LanCIDR, force-policy=direct, update-interval=86400, enabled=true
