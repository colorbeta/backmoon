[rewrite_remote]
# Intentionally empty. Domain adblocking is configured in filter_remote.
[rewrite_local]
# Intentionally empty.
[task_local]
# No third-party scripts enabled.
[http_backend]
# No local HTTP backend enabled.
[mitm]
# No certificate or hostnames configured; HTTPS interception is unused.
skip_validating_cert = false
