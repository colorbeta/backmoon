# Ubuntu Mihomo template
# Run with permission to create TUN routes. Replace subscription URL before use.
mixed-port: 7890
allow-lan: false
bind-address: 127.0.0.1
mode: rule
log-level: warning
ipv6: false
external-controller: 127.0.0.1:9090
secret: ''
unified-delay: true
tcp-concurrent: true
keep-alive-idle: 600
keep-alive-interval: 15
tun:
  enable: true
  stack: mixed
  dns-hijack:
  - any:53
  - tcp://any:53
  auto-route: true
  auto-detect-interface: true
  strict-route: true
profile:
  store-selected: true
dns:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  default-nameserver:
  - https://223.5.5.5/dns-query
  nameserver:
  - https://1.1.1.1/dns-query#LocalFly
  - https://8.8.8.8/dns-query#LocalFly
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - localhost.ptlogin2.qq.com
  - +.msftconnecttest.com
  - +.msftncsi.com
  - time.*.com
  - +.pool.ntp.org
  respect-rules: true
  proxy-server-nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  direct-nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  nameserver-policy:
    "rule-set:Special,Private":
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    "rule-set:SteamCN,DomesticMedia":
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    "+.minimax.io":
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    "rule-set:ai":
    - https://1.1.1.1/dns-query#ForeignFly
    - https://8.8.8.8/dns-query#ForeignFly
    "rule-set:ForeignMedia,GitHub,Telegram,Steam,apple,tiktok":
    - https://1.1.1.1/dns-query#LocalFly
    - https://8.8.8.8/dns-query#LocalFly
    "rule-set:Google":
    - https://1.1.1.1/dns-query#ForeignFly
    - https://8.8.8.8/dns-query#ForeignFly
    "rule-set:Domestic":
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    "rule-set:Technology":
    - https://1.1.1.1/dns-query#LocalFly
    - https://8.8.8.8/dns-query#LocalFly
proxy-providers:
  Airport:
    type: http
    proxy: DIRECT
    url: https://example.com/replace-with-your-subscription
    interval: 3600
    path: ./providers/airport.yaml
    health-check:
      enable: true
      lazy: false
      interval: 600
      url: https://www.gstatic.com/generate_204
proxy-groups:
- name: LocalFly
  icon: https://raw.githubusercontent.com/colorbeta/backmoon/test/icon/LocalFly.png
  type: select
  proxies: [LocalFly-AUTO, Auto_TW, Auto_HK, Auto_JP, Auto_SG]
- name: ForeignFly
  icon: https://raw.githubusercontent.com/colorbeta/backmoon/test/icon/ForeignFly.png
  type: select
  proxies: [ForeignFly-AUTO, Auto_SG, Auto_JP, Auto_US]
- name: LocalFly-AUTO
  icon: https://raw.githubusercontent.com/colorbeta/backmoon/test/icon/Auto.png
  type: url-test
  hidden: true
  proxies: [Auto_TW, Auto_HK, Auto_JP, Auto_SG]
  url: https://www.gstatic.com/generate_204
  interval: 600
  tolerance: 80
- name: ForeignFly-AUTO
  icon: https://raw.githubusercontent.com/colorbeta/backmoon/test/icon/Auto.png
  type: fallback
  hidden: true
  proxies: [Auto_SG, Auto_JP, Auto_US]
  url: https://www.gstatic.com/generate_204
  interval: 600
- name: Auto_HK
  icon: https://raw.githubusercontent.com/colorbeta/backmoon/test/icon/HongKong.png
  type: url-test
  empty-fallback: REJECT
  use:
  - Airport
  filter: '(?i)香港|港[ _-]*[0-9]|🇭🇰|(^|[^a-z])(HK|HKG|Hong[ _-]*Kong)([^a-z]|$)'
  url: https://www.gstatic.com/generate_204
  interval: 600
  tolerance: 80
  lazy: false
- name: Auto_TW
  icon: https://raw.githubusercontent.com/colorbeta/backmoon/test/icon/Taiwan.png
  type: url-test
  empty-fallback: REJECT
  use:
  - Airport
  filter: '(?i)台湾|台灣|臺灣|台北|臺北|台[ _-]*[0-9]|🇹🇼|(^|[^a-z])(TW|TWN|Taiwan|Taipei)([^a-z]|$)'
  url: https://www.gstatic.com/generate_204
  interval: 600
  tolerance: 80
  lazy: false
- name: Auto_JP
  icon: https://raw.githubusercontent.com/colorbeta/backmoon/test/icon/Japan.png
  type: url-test
  empty-fallback: REJECT
  use:
  - Airport
  filter: '(?i)日本|东京|東京|大阪|日[ _-]*[0-9]|🇯🇵|(^|[^a-z])(JP|JPN|Japan|Tokyo|Osaka)([^a-z]|$)'
  url: https://www.gstatic.com/generate_204
  interval: 600
  tolerance: 80
  lazy: false
- name: Auto_SG
  icon: https://raw.githubusercontent.com/colorbeta/backmoon/test/icon/Singapore.png
  type: url-test
  empty-fallback: REJECT
  use:
  - Airport
  filter: '(?i)新加坡|狮城|獅城|🇸🇬|(^|[^a-z])(SG|SGP|Singapore)([^a-z]|$)'
  url: https://www.gstatic.com/generate_204
  interval: 600
  tolerance: 80
  lazy: false
- name: Auto_US
  icon: https://raw.githubusercontent.com/colorbeta/backmoon/test/icon/UnitedStates.png
  type: url-test
  empty-fallback: REJECT
  use:
  - Airport
  filter: '(?i)美国|美國|美[ _-]*[0-9]|🇺🇸|(^|[^a-z])(US|USA|United[ _-]*States|America)([^a-z]|$)'
  url: https://www.gstatic.com/generate_204
  interval: 600
  tolerance: 80
  lazy: false
rules:
# Manual deny, LAN, ads, Special/application direct, services and final fallback.
- RULE-SET,Forbid,REJECT
- IP-CIDR,192.168.50.0/24,DIRECT,no-resolve
- RULE-SET,Private,DIRECT
- RULE-SET,LanCIDR,DIRECT,no-resolve
- RULE-SET,adblock,REJECT
- RULE-SET,Special,DIRECT
- RULE-SET,Applications,DIRECT
- RULE-SET,SteamCN,DIRECT
- RULE-SET,DomesticMedia,DIRECT
- RULE-SET,GitHub,LocalFly
- RULE-SET,ForeignMedia,LocalFly
- RULE-SET,Google,ForeignFly
- AND,((RULE-SET,ai),(NOT,((RULE-SET,Domestic)))),ForeignFly
- RULE-SET,Telegram,LocalFly
- RULE-SET,Steam,LocalFly
- RULE-SET,apple,LocalFly
- RULE-SET,tiktok,LocalFly
- RULE-SET,Domestic,DIRECT
- RULE-SET,Technology,LocalFly
- RULE-SET,DomesticIP,DIRECT,no-resolve
- GEOIP,CN,DIRECT,no-resolve
- MATCH,LocalFly
rule-providers:
  Forbid:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/colorbeta/backmoon/test/Clash/rule/Forbid.yaml
    path: ./Clash/rule/Forbid.yaml
    interval: 86400
  Special:
    type: http
