# OpenWrt OpenClash / Mihomo template
# Enable OpenClash DNS hijack in the OpenClash UI. Replace subscription URL before use.
mixed-port: 7890
redir-port: 7892
tproxy-port: 7895
allow-lan: true
bind-address: '*'
mode: rule
log-level: warning
ipv6: false
external-controller: 127.0.0.1:9090
secret: ''
unified-delay: true
tcp-concurrent: true
keep-alive-idle: 600
keep-alive-interval: 15
profile:
  store-selected: true
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  default-nameserver:
  - https://223.5.5.5/dns-query
  nameserver:
  - https://1.1.1.1/dns-query#LocalFly
  - https://8.8.8.8/dns-query#LocalFly
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - localhost.ptlogin2.qq.com
  - +.msftconnecttest.com
  - +.msftncsi.com
  - time.*.com
  - +.pool.ntp.org
  respect-rules: true
  proxy-server-nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  direct-nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  nameserver-policy:
    "rule-set:Special,Private":
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    "rule-set:SteamCN,DomesticMedia":
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    "+.minimax.io":
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    "rule-set:ai":
    - https://1.1.1.1/dns-query#ForeignFly
    - https://8.8.8.8/dns-query#ForeignFly
    "rule-set:ForeignMedia,GitHub,Telegram,Steam,apple,tiktok":
    - https://1.1.1.1/dns-query#LocalFly
    - https://8.8.8.8/dns-query#LocalFly
    "rule-set:Google":
    - https://1.1.1.1/dns-query#ForeignFly
    - https://8.8.8.8/dns-query#ForeignFly
    "rule-set:Domestic":
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    "rule-set:Technology":
    - https://1.1.1.1/dns-query#LocalFly
    - https://8.8.8.8/dns-query#LocalFly
proxy-providers:
  Airport:
    type: http
    proxy: DIRECT
    url: https://example.com/replace-with-your-subscription
    interval: 3600
    path: ./providers/airport.yaml
    health-check:
      enable: true
      lazy: false
      interval: 600
      url: https://www.gstatic.com/generate_204
proxy-groups:
- name: LocalFly
  type: select
  proxies: [LocalFly-AUTO, 台湾, 香港, 日本, 新加坡]
- name: ForeignFly
  type: select
  proxies: [ForeignFly-AUTO, 新加坡, 日本, 美国]
- name: LocalFly-AUTO
  type: url-test
  hidden: true
  proxies: [台湾, 香港, 日本, 新加坡]
  url: https://www.gstatic.com/generate_204
  interval: 600
  tolerance: 80
- name: ForeignFly-AUTO
  type: url-test
  hidden: true
  proxies: [新加坡, 日本, 美国]
  url: https://www.gstatic.com/generate_204
  interval: 600
  tolerance: 80
- name: 香港
  type: url-test
  empty-fallback: REJECT
  use:
  - Airport
  filter: '(?i)香港|港[ _-]*[0-9]|🇭🇰|(^|[^a-z])(HK|HKG|Hong[ _-]*Kong)([^a-z]|$)'
  url: https://www.gstatic.com/generate_204
  interval: 600
  tolerance: 80
  lazy: false
- name: 台湾
  type: url-test
  empty-fallback: REJECT
  use:
  - Airport
  filter: '(?i)台湾|台灣|臺灣|台北|臺北|台[ _-]*[0-9]|🇹🇼|(^|[^a-z])(TW|TWN|Taiwan|Taipei)([^a-z]|$)'
  url: https://www.gstatic.com/generate_204
  interval: 600
  tolerance: 80
  lazy: false
- name: 日本
  type: url-test
  empty-fallback: REJECT
  use:
  - Airport
  filter: '(?i)日本|东京|東京|大阪|日[ _-]*[0-9]|🇯🇵|(^|[^a-z])(JP|JPN|Japan|Tokyo|Osaka)([^a-z]|$)'
  url: https://www.gstatic.com/generate_204
  interval: 600
  tolerance: 80
  lazy: false
- name: 新加坡
  type: url-test
  empty-fallback: REJECT
  use:
  - Airport
  filter: '(?i)新加坡|狮城|獅城|🇸🇬|(^|[^a-z])(SG|SGP|Singapore)([^a-z]|$)'
  url: https://www.gstatic.com/generate_204
  interval: 600
  tolerance: 80
  lazy: false
- name: 美国
  type: url-test
  empty-fallback: REJECT
  use:
  - Airport
  filter: '(?i)美国|美國|美[ _-]*[0-9]|🇺🇸|(^|[^a-z])(US|USA|United[ _-]*States|America)([^a-z]|$)'
  url: https://www.gstatic.com/generate_204
  interval: 600
  tolerance: 80
  lazy: false
rules:
# LAN and explicit local application/update exceptions.
- IP-CIDR,192.168.50.0/24,DIRECT,no-resolve
- RULE-SET,Private,DIRECT
- RULE-SET,LanCIDR,DIRECT,no-resolve
- RULE-SET,Special,DIRECT
- RULE-SET,Applications,DIRECT
- RULE-SET,adblock,REJECT
- RULE-SET,SteamCN,DIRECT
- RULE-SET,DomesticMedia,DIRECT
# Domestic AI has priority over the overlapping overseas AI collection.
- AND,((RULE-SET,ai),(NOT,((RULE-SET,Domestic)))),ForeignFly
# Specific overseas services precede broad mainland suffixes such as .cn.
- RULE-SET,ForeignMedia,LocalFly
- RULE-SET,GitHub,LocalFly
- RULE-SET,Telegram,LocalFly
- RULE-SET,Steam,LocalFly
- RULE-SET,apple,LocalFly
- RULE-SET,tiktok,LocalFly
- RULE-SET,Google,ForeignFly
- RULE-SET,Domestic,DIRECT
- RULE-SET,Technology,LocalFly
- RULE-SET,DomesticIP,DIRECT,no-resolve
- GEOIP,CN,DIRECT,no-resolve
- MATCH,LocalFly
rule-providers:
  Special:
    type: http
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/colorbeta/backmoon/test/mrs/Special.mrs
    path: ./mrs/Special.mrs
    interval: 86400
