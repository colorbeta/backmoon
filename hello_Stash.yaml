# Stash iOS template
# Stash owns the iOS VPN path; encrypted DNS is used without Mihomo-only TUN fields. Replace subscription URL before use.
mixed-port: 7890
allow-lan: false
bind-address: 127.0.0.1
mode: rule
log-level: warning
ipv6: false
external-controller: 127.0.0.1:9090
secret: ''
unified-delay: true
profile:
  store-selected: true
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  default-nameserver:
  - https://223.5.5.5/dns-query
  nameserver:
  - https://223.5.5.5/dns-query
  - https://1.1.1.1/dns-query
  nameserver-policy:
    "+.cn": &domestic_dns
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
    "+.lan": *domestic_dns
    "+.local": *domestic_dns
    "+.openai.com": &foreign_dns
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
    "+.chatgpt.com": *foreign_dns
    "+.anthropic.com": *foreign_dns
    "+.claude.ai": *foreign_dns
    "+.google.com": *foreign_dns
    "+.googleapis.com": *foreign_dns
    "+.gstatic.com": *foreign_dns
    "+.googleusercontent.com": *foreign_dns
    "+.youtube.com": *foreign_dns
    "+.ytimg.com": *foreign_dns
    "+.github.com": *foreign_dns
    "+.githubusercontent.com": *foreign_dns
    "+.githubassets.com": *foreign_dns
    "+.telegram.org": *foreign_dns
    "+.t.me": *foreign_dns
    "+.telegra.ph": *foreign_dns
    "+.steampowered.com": *foreign_dns
    "+.steamcommunity.com": *foreign_dns
    "+.steamstatic.com": *foreign_dns
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - localhost.ptlogin2.qq.com
  - +.msftconnecttest.com
  - +.msftncsi.com
  - time.*.com
  - +.pool.ntp.org
  follow-rule: true
proxy-providers:
  Airport:
    type: http
    url: https://example.com/replace-with-your-subscription
    interval: 3600
    path: ./providers/airport.yaml
    health-check:
      enable: true
      interval: 600
      url: https://www.gstatic.com/generate_204
proxy-groups:
- name: PROXY
  type: select
  proxies:
  - AUTO
  - HK-FALLBACK
  - JP-FALLBACK
  - SG-FALLBACK
  - US-FALLBACK
  - HK-AUTO
  - JP-AUTO
  - SG-AUTO
  - US-AUTO
  - MANUAL
  - DIRECT
- name: SPECIAL
  type: select
  proxies:
  - DIRECT
  - PROXY
- name: ADBLOCK
  type: select
  proxies:
  - REJECT
  - DIRECT
- name: CNBANK
  type: select
  proxies:
  - DIRECT
  - PROXY
- name: AI
  type: select
  proxies:
  - US-FALLBACK
  - SG-FALLBACK
  - JP-FALLBACK
  - AUTO
  - MANUAL
- name: GOOGLE-FCM
  type: select
  proxies:
  - SG-FALLBACK
  - HK-FALLBACK
  - JP-FALLBACK
  - AUTO
  - MANUAL
- name: GOOGLE
  type: select
  proxies: [HK-FALLBACK, SG-FALLBACK, JP-FALLBACK, AUTO, MANUAL]
- name: GITHUB
  type: select
  proxies: [JP-FALLBACK, HK-FALLBACK, SG-FALLBACK, AUTO, MANUAL]
- name: TELEGRAM
  type: select
  proxies: [SG-FALLBACK, HK-FALLBACK, JP-FALLBACK, AUTO, MANUAL]
- name: STEAM
  type: select
  proxies: [HK-FALLBACK, JP-FALLBACK, SG-FALLBACK, AUTO, MANUAL, DIRECT]
- name: FOREIGN-MEDIA
  type: select
  proxies:
  - AUTO
  - HK-FALLBACK
  - JP-FALLBACK
  - SG-FALLBACK
  - US-FALLBACK
  - MANUAL
- name: DOMESTIC-MEDIA
  type: select
  proxies:
  - DIRECT
  - PROXY
- name: TECHNOLOGY
  type: select
  proxies:
  - AUTO
  - HK-FALLBACK
  - JP-FALLBACK
  - SG-FALLBACK
  - US-FALLBACK
  - MANUAL
  - DIRECT
- name: APPLE
  type: fallback
  proxies:
  - HK-FALLBACK
  - JP-FALLBACK
  - SG-FALLBACK
  - US-FALLBACK
  - AUTO
  url: https://www.gstatic.com/generate_204
  interval: 600
- name: TIKTOK
  type: select
  proxies:
  - SG-FALLBACK
  - JP-FALLBACK
  - US-FALLBACK
  - AUTO
  - MANUAL
- name: DOMESTIC
  type: select
  proxies:
  - DIRECT
  - PROXY
- name: FINAL
  type: select
  proxies:
  - PROXY
  - AUTO
- name: HK-FALLBACK
  type: fallback
  use: [Airport]
  filter: (?i)港|香港|HK|Hong Kong
  url: https://www.gstatic.com/generate_204
  interval: 600
  lazy: true
- name: JP-FALLBACK
  type: fallback
  use: [Airport]
  filter: (?i)日|日本|JP|Japan|Tokyo
  url: https://www.gstatic.com/generate_204
  interval: 600
  lazy: true
- name: SG-FALLBACK
  type: fallback
  use: [Airport]
  filter: (?i)新|新加坡|SG|Singapore
  url: https://www.gstatic.com/generate_204
  interval: 600
  lazy: true
- name: US-FALLBACK
  type: fallback
  use: [Airport]
  filter: (?i)美|美国|US|United States|America
  url: https://www.gstatic.com/generate_204
  interval: 600
  lazy: true
- name: AUTO
  type: url-test
  use:
  - Airport
  url: https://www.gstatic.com/generate_204
  interval: 600
  tolerance: 80
- name: HK-AUTO
  type: url-test
  use:
  - Airport
  filter: (?i)港|香港|HK|Hong Kong
  url: https://www.gstatic.com/generate_204
  interval: 600
  tolerance: 80
- name: JP-AUTO
  type: url-test
  use:
  - Airport
  filter: (?i)日|日本|JP|Japan|Tokyo
  url: https://www.gstatic.com/generate_204
  interval: 600
  tolerance: 80
- name: SG-AUTO
  type: url-test
  use:
  - Airport
  filter: (?i)新|新加坡|SG|Singapore
  url: https://www.gstatic.com/generate_204
  interval: 600
  tolerance: 80
- name: US-AUTO
  type: url-test
  use:
  - Airport
  filter: (?i)美|美国|US|United States|America
  url: https://www.gstatic.com/generate_204
  interval: 600
  tolerance: 80
- name: MANUAL
  type: select
  use:
  - Airport
rules:
- RULE-SET,Special,SPECIAL
- RULE-SET,Applications,SPECIAL
- IP-CIDR,192.168.50.0/24,SPECIAL,no-resolve
- RULE-SET,Private,SPECIAL
- RULE-SET,LanCIDR,SPECIAL,no-resolve
- RULE-SET,CNBank,CNBANK
- RULE-SET,adblock,ADBLOCK
- RULE-SET,ai,AI
- RULE-SET,google_fcm,GOOGLE-FCM
- RULE-SET,ForeignMedia,FOREIGN-MEDIA
- RULE-SET,Google,GOOGLE
- RULE-SET,GoogleIP,GOOGLE,no-resolve
- RULE-SET,GitHub,GITHUB
- RULE-SET,Telegram,TELEGRAM
- RULE-SET,TelegramIP,TELEGRAM,no-resolve
- RULE-SET,SteamCN,SPECIAL
- RULE-SET,Steam,STEAM
- RULE-SET,DomesticMedia,DOMESTIC-MEDIA
- RULE-SET,Technology,TECHNOLOGY
- RULE-SET,apple,APPLE
- RULE-SET,tiktok,TIKTOK
- RULE-SET,Domestic,DOMESTIC
- RULE-SET,DomesticIP,DOMESTIC,no-resolve
- GEOIP,CN,DOMESTIC,no-resolve
- MATCH,FINAL
