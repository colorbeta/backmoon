# Stash iOS template
# Stash owns the iOS VPN path; encrypted DNS is used without Mihomo-only TUN fields. Replace subscription URL before use.
mixed-port: 7890
allow-lan: false
bind-address: 127.0.0.1
mode: rule
log-level: warning
ipv6: false
external-controller: 127.0.0.1:9090
secret: ''
unified-delay: true
profile:
  store-selected: true
dns:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  default-nameserver:
  - https://223.5.5.5/dns-query
  proxy-server-nameserver:
  - https://223.5.5.5/dns-query
  nameserver:
  - https://223.5.5.5/dns-query
  - https://1.1.1.1/dns-query
  nameserver-policy:
    "+.cn": &domestic_dns
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
    "+.lan": *domestic_dns
    "+.local": *domestic_dns
    "+.minimax.io": *domestic_dns
    "+.deepseek.com": *domestic_dns
    "+.doubao.com": *domestic_dns
    "+.qwen.ai": *domestic_dns
    "+.qwenlm.ai": *domestic_dns
    "+.gamersky.com": *domestic_dns
    "+.maycur.com": *domestic_dns
    "+.openai.com": &foreign_dns
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
    "+.chatgpt.com": *foreign_dns
    "+.anthropic.com": *foreign_dns
    "+.claude.ai": *foreign_dns
    "+.google.com": *foreign_dns
    "+.googleapis.com": *foreign_dns
    "+.googleapis.cn": *foreign_dns
    "+.xn--ngstr-lra8j.com": *foreign_dns
    "+.gstatic.com": *foreign_dns
    "+.googleusercontent.com": *foreign_dns
    "+.youtube.com": *foreign_dns
    "+.ytimg.com": *foreign_dns
    "+.github.com": *foreign_dns
    "+.githubusercontent.com": *foreign_dns
    "+.githubassets.com": *foreign_dns
    "+.telegram.org": *foreign_dns
    "+.t.me": *foreign_dns
    "+.telegra.ph": *foreign_dns
    "+.steampowered.com": *foreign_dns
    "+.steamcommunity.com": *foreign_dns
    "+.steamstatic.com": *foreign_dns
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - localhost.ptlogin2.qq.com
  - +.msftconnecttest.com
  - +.msftncsi.com
  - time.*.com
  - +.pool.ntp.org
  follow-rule: true
proxy-providers:
  Airport:
    type: http
    benchmark-url: https://www.gstatic.com/generate_204
    benchmark-timeout: 5
    url: https://example.com/replace-with-your-subscription
    interval: 3600
    path: ./providers/airport.yaml
    health-check:
      enable: true
      interval: 600
      url: https://www.gstatic.com/generate_204
proxy-groups:
- name: LocalFly
  icon: https://raw.githubusercontent.com/colorbeta/backmoon/test/icon/LocalFly.png
  type: select
  proxies: [LocalFly-AUTO, 台湾, 香港, 日本, 新加坡]
- name: ForeignFly
  icon: https://raw.githubusercontent.com/colorbeta/backmoon/test/icon/ForeignFly.png
  type: select
  proxies: [ForeignFly-AUTO, 新加坡, 日本, 美国]
- name: LocalFly-AUTO
  icon: https://raw.githubusercontent.com/colorbeta/backmoon/test/icon/Auto.png
  type: url-test
  hidden: true
  proxies: [台湾, 香港, 日本, 新加坡]
  url: https://www.gstatic.com/generate_204
  interval: 600
  tolerance: 80
- name: ForeignFly-AUTO
  icon: https://raw.githubusercontent.com/colorbeta/backmoon/test/icon/Auto.png
  type: url-test
  hidden: true
  proxies: [新加坡, 日本, 美国]
  url: https://www.gstatic.com/generate_204
  interval: 600
  tolerance: 80
- name: 香港
  icon: https://raw.githubusercontent.com/colorbeta/backmoon/test/icon/HongKong.png
  type: url-test
  proxies:
  - REJECT
  use:
  - Airport
  filter: '(?i)香港|港[ _-]*[0-9]|🇭🇰|(^|[^a-z])(HK|HKG|Hong[ _-]*Kong)([^a-z]|$)'
  url: https://www.gstatic.com/generate_204
  interval: 600
  tolerance: 80
  lazy: false
- name: 台湾
  icon: https://raw.githubusercontent.com/colorbeta/backmoon/test/icon/Taiwan.png
  type: url-test
  proxies:
  - REJECT
  use:
  - Airport
  filter: '(?i)台湾|台灣|臺灣|台北|臺北|台[ _-]*[0-9]|🇹🇼|(^|[^a-z])(TW|TWN|Taiwan|Taipei)([^a-z]|$)'
  url: https://www.gstatic.com/generate_204
  interval: 600
  tolerance: 80
  lazy: false
- name: 日本
  icon: https://raw.githubusercontent.com/colorbeta/backmoon/test/icon/Japan.png
  type: url-test
  proxies:
  - REJECT
  use:
  - Airport
  filter: '(?i)日本|东京|東京|大阪|日[ _-]*[0-9]|🇯🇵|(^|[^a-z])(JP|JPN|Japan|Tokyo|Osaka)([^a-z]|$)'
  url: https://www.gstatic.com/generate_204
  interval: 600
  tolerance: 80
  lazy: false
- name: 新加坡
  icon: https://raw.githubusercontent.com/colorbeta/backmoon/test/icon/Singapore.png
  type: url-test
  proxies:
  - REJECT
  use:
  - Airport
  filter: '(?i)新加坡|狮城|獅城|🇸🇬|(^|[^a-z])(SG|SGP|Singapore)([^a-z]|$)'
  url: https://www.gstatic.com/generate_204
  interval: 600
  tolerance: 80
  lazy: false
- name: 美国
  icon: https://raw.githubusercontent.com/colorbeta/backmoon/test/icon/UnitedStates.png
  type: url-test
  proxies:
  - REJECT
  use:
  - Airport
  filter: '(?i)美国|美國|美[ _-]*[0-9]|🇺🇸|(^|[^a-z])(US|USA|United[ _-]*States|America)([^a-z]|$)'
  url: https://www.gstatic.com/generate_204
  interval: 600
  tolerance: 80
  lazy: false
rules:
# LAN and explicit local application/update exceptions.
- IP-CIDR,192.168.50.0/24,DIRECT,no-resolve
- RULE-SET,Private,DIRECT
- RULE-SET,LanCIDR,DIRECT,no-resolve
  # Encrypted bootstrap DNS must work before subscription proxies are loaded.
- IP-CIDR,223.5.5.5/32,DIRECT,no-resolve
- RULE-SET,Special,DIRECT
- RULE-SET,Applications,DIRECT
- RULE-SET,adblock,REJECT
- RULE-SET,SteamCN,DIRECT
- RULE-SET,DomesticMedia,DIRECT
# Domestic AI has priority over the overlapping overseas AI collection.
- AND,((RULE-SET,ai),(NOT,((RULE-SET,Domestic)))),ForeignFly
# Specific overseas services precede broad mainland suffixes such as .cn.
- RULE-SET,ForeignMedia,LocalFly
- RULE-SET,GitHub,LocalFly
- RULE-SET,Telegram,LocalFly
- RULE-SET,Steam,LocalFly
- RULE-SET,apple,LocalFly
- RULE-SET,tiktok,LocalFly
- RULE-SET,Google,ForeignFly
- RULE-SET,Domestic,DIRECT
- RULE-SET,Technology,LocalFly
- RULE-SET,DomesticIP,DIRECT,no-resolve
- GEOIP,CN,DIRECT,no-resolve
- MATCH,LocalFly
rule-providers:
  Special:
    type: http
    behavior: domain
    url: https://raw.githubusercontent.com/colorbeta/backmoon/test/rule/Special.yaml
    path: ./rule/Special.yaml
    interval: 86400
  Applications:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/colorbeta/backmoon/test/rule/Applications.yaml
    path: ./rule/Applications.yaml
    interval: 86400
  Private:
    type: http
    behavior: domain
    url: https://raw.githubusercontent.com/colorbeta/backmoon/test/rule/Private.yaml
    path: ./rule/Private.yaml
    interval: 86400
  LanCIDR:
    type: http
    behavior: ipcidr
    url: https://raw.githubusercontent.com/colorbeta/backmoon/test/rule/LanCIDR.yaml
    path: ./rule/LanCIDR.yaml
