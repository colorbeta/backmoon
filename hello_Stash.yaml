    interval: 28800
  ai:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/colorbeta/backmoon/test/rule/ai.yaml
    path: ./rule/ai.yaml
    interval: 86400
  ForeignMedia:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/colorbeta/backmoon/test/rule/ForeignMedia.yaml
    path: ./rule/ForeignMedia.yaml
    interval: 86400
  Google:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/colorbeta/backmoon/test/rule/google.yaml
    path: ./rule/google.yaml
    interval: 86400
  GitHub:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/colorbeta/backmoon/test/rule/github.yaml
    path: ./rule/github.yaml
    interval: 86400
  Telegram:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/colorbeta/backmoon/test/rule/telegram.yaml
    path: ./rule/telegram.yaml
    interval: 86400
  SteamCN:
    type: http
    behavior: domain
    url: https://raw.githubusercontent.com/colorbeta/backmoon/test/rule/steam_cn.yaml
    path: ./rule/steam_cn.yaml
    interval: 86400
  Steam:
    type: http
    behavior: domain
    url: https://raw.githubusercontent.com/colorbeta/backmoon/test/rule/steam.yaml
    path: ./rule/steam.yaml
    interval: 86400
  DomesticMedia:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/colorbeta/backmoon/test/rule/DomesticMedia.yaml
    path: ./rule/DomesticMedia.yaml
    interval: 86400
  Technology:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/colorbeta/backmoon/test/rule/Technology.yaml
    path: ./rule/Technology.yaml
    interval: 86400
  apple:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/colorbeta/backmoon/test/rule/apple.yaml
    path: ./rule/apple.yaml
    interval: 86400
  tiktok:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/colorbeta/backmoon/test/rule/tiktok.yaml
    path: ./rule/tiktok.yaml
    interval: 86400
  Domestic:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/colorbeta/backmoon/test/rule/Domestic.yaml
